<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thank you for contacting Albin EB - Full Stack Developer" />
  <title>Thank You - Albin EB Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #000;
      --white: #fff;
      --gray: #ccc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--white);
      color: var(--black);
      line-height: 1.6;
      padding: 0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Navigation */
    header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      transition: all 0.3s ease;
    }

    nav {
      background: var(--white);
      padding: 0.5rem 2rem;
      border-radius: 50px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
    }

    nav a {
      text-decoration: none;
      color: var(--black);
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: var(--gray);
    }

    /* Main Container */
    .container {
      background: var(--white);
      max-width: 800px;
      margin: 120px auto 40px auto;
      padding: 4rem 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 2px solid var(--black);
      text-align: center;
      flex: 1;
    }

    /* Thank You Section */
    .thank-you-section {
      margin-bottom: 3rem;
    }

    .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--black);
      margin: 0 auto 2rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.6s ease-out;
    }

    .checkmark svg {
      width: 40px;
      height: 40px;
      fill: var(--white);
    }

    @keyframes scaleIn {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.2); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--black);
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.3s forwards;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.6s forwards;
    }

    .message {
      font-size: 1rem;
      color: #555;
      max-width: 500px;
      margin: 0 auto 3rem auto;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.9s forwards;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Social Media Section */
    .social-section {
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 1.2s forwards;
    }

    .social-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--black);
    }

    .social-icons {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .social-icon {
      width: 60px;
      height: 60px;
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--black);
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .social-icon::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: var(--black);
      border-radius: 50%;
      transition: all 0.3s ease;
      transform: translate(-50%, -50%);
    }

    .social-icon:hover::before {
      width: 100px;
      height: 100px;
    }

    .social-icon:hover {
      color: var(--white);
      transform: translateY(-5px) scale(1.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .social-icon svg {
      width: 24px;
      height: 24px;
      position: relative;
      z-index: 1;
    }

    /* Back to Portfolio Button */
    .back-btn {
      display: inline-block;
      background: var(--black);
      color: var(--white);
      padding: 1rem 2.5rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      border: 2px solid var(--black);
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 1.5s forwards;
    }

    .back-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: var(--white);
      border-radius: 50%;
      transition: all 0.4s ease;
      transform: translate(-50%, -50%);
    }

    .back-btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .back-btn:hover {
      color: var(--black);
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .back-btn span {
      position: relative;
      z-index: 1;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      color: #666;
      font-size: 0.9rem;
      margin-top: auto;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .container {
        max-width: 95%;
        margin: 100px auto 20px auto;
        padding: 2.5rem 1.5rem;
        border-radius: 15px;
      }

      h1 {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 1.1rem;
      }

      .message {
        font-size: 0.9rem;
      }

      .social-icons {
        gap: 1rem;
      }

      .social-icon {
        width: 50px;
        height: 50px;
      }

      .social-icon svg {
        width: 20px;
        height: 20px;
      }

      nav {
        padding: 0.6rem 1.8rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        margin: 90px auto 15px auto;
        padding: 2rem 1rem;
        border-radius: 10px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .checkmark {
        width: 60px;
        height: 60px;
      }

      .checkmark svg {
        width: 30px;
        height: 30px;
      }

      .back-btn {
        padding: 0.8rem 2rem;
        font-size: 0.9rem;
      }
    }

    /* Floating particles animation */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      pointer-events: none;
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
      50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
    }
  </style>
</head>

<body>

  <script>
    // Create floating particles
    function createParticles() {
      const body = document.body;
      const particleCount = 8;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 6 + 's';
        particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
        body.appendChild(particle);
      }
    }

    // Initialize particles on load
    document.addEventListener('DOMContentLoaded', function() {
      createParticles();
    });

    // Header scroll effect
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header');
      if (window.pageYOffset > 50) {
        header.style.transform = 'translateX(-50%) translateY(-5px)';
        header.style.opacity = '0.95';
      } else {
        header.style.transform = 'translateX(-50%) translateY(0)';
        header.style.opacity = '1';
      }
    });
  </script>
